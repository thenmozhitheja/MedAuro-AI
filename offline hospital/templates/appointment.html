<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Offline AI Hospital - Book Appointment</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🏥 Offline AI Hospital</h1>
            <p>Book an Appointment</p>
        </div>

        <div class="form-box">

            <form id="appointmentForm">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone">
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="General Medicine">General Medicine</option>
                        <option value="Emergency Care">Emergency Care</option>
                        <option value="Orthopedics">Orthopedics</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="time" required>
                </div>

                <button type="submit">
                    📅 Book Appointment
                </button>

            </form>

            <div id="result"></div>

        </div>

    </div>


    <script>

        document.getElementById("appointmentForm").addEventListener("submit", async function (event) {

            event.preventDefault();

            const resultBox = document.getElementById("result");

            const appointmentData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                department: document.getElementById("department").value,
                date: document.getElementById("date").value,
                time: document.getElementById("time").value
            };

            try {

                const response = await fetch("/book_appointment", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(appointmentData)

                });

                const data = await response.json();

                resultBox.style.display = "block";

                if (data.success) {

                    resultBox.className = "success";

                    resultBox.innerHTML = `
                        <h3>✅ Appointment Booked</h3>
                        <br>
                        <p>${appointmentData.department} on ${appointmentData.date} at ${appointmentData.time}</p>
                        <br>
                        <p>💾 Saved locally. Will sync to the server automatically once connected.</p>
                    `;

                    document.getElementById("appointmentForm").reset();

                } else {

                    resultBox.className = "error";
                    resultBox.textContent = data.message;

                }

            } catch (error) {

                resultBox.style.display = "block";
                resultBox.className = "error";
                resultBox.textContent =
                    "Unable to connect to the local hospital system.";

            }

        });

    </script>

</body>

</html>
